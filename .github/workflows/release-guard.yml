# The release flow is manual (rename Unreleased, bump version, tag) — this
# fails loudly when a vX.Y.Z tag doesn't match what was actually committed,
# before consumers pick the tag up via #semver:^1.
name: Release guard

on:
  push:
    tags: [ 'v*' ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json version and a CHANGELOG heading
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          if ! grep -qE "^## $TAG — " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $TAG — <date>' heading — was Unreleased renamed?"
            exit 1
          fi
          if grep -qE "^## Unreleased" CHANGELOG.md && sed -n '/^## Unreleased/,/^## /p' CHANGELOG.md | grep -qE '^- '; then
            echo "::error::CHANGELOG.md still has bullets under ## Unreleased — did they belong in $TAG?"
            exit 1
          fi
          echo "v$TAG: package.json and CHANGELOG.md agree"
